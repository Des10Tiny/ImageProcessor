name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake
        run: |
          mkdir -p tests/build
          cd tests/build
          cmake ..

      - name: Build everything (Main + Tests)
        run: |
          cd tests/build
          cmake --build .

      - name: Run tests
        run: |
          cd tests/build
          ctest --output-on-failure

      - name: Verify tests passed
        run: |
          cd tests/build
          ctest --output-on-failure || exit 1

      - name: Clean up
        run: |
          rm -rf tests/build/ output.bmp output_gs.bmp output_neg.bmp output_neg_gs.bmp 
          rm -rf temp_neg.bmp temp_orig.bmp temp_output.bmp output_multiple_filters.bmp
          rm -rf output_missing_params.bmp output_extra_params.bmp output_multithread.bmp